<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Webpage</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* General styles */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f5f5f5;
}

/* Navigation bar using Flexbox */
.navbar {
    background-color: #333;
    padding: 10px;
}

.navbar ul {
    list-style: none;
    display: flex;
    justify-content: center;
    padding: 0;
}

.navbar ul li {
    margin: 0 15px;
}

.navbar ul li a {
    text-decoration: none;
    color: white;
}

/* Container using CSS Grid */
.container {
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 20px;
    padding: 20px;
    text-align: center;
}

/* Styling elements */
header {
    background-color: #ff5733;
    padding: 20px;
    color: white;
}

.content {
    background-color: white;
    padding: 20px;
    border-radius: 8px;
}

/* Footer */
footer {
    background-color: #333;
    color: white;
    padding: 10px;
}

/* Responsive Design using Media Queries */
@media screen and (max-width: 768px) {
    .navbar ul {
        flex-direction: column;
        text-align: center;
    }

    .container {
        padding: 10px;
    }

    header {
        font-size: 22px;
    }
}
    </style>
</head>
<body>

    <nav class="navbar">
        <ul>
            <li><a href="Matchday.html">football match</a></li>
            <li><a href="Date.html">Which day</a></li>
            <li><a href="Time.html">Kickoff</a></li>
            <li><a href="Awards.html">Incentives</a></li>
        </ul>
    </nav>

    <div class="container">
        <header>
            <h1>Simple Responsive Webpage</h1>
        </header>

        <section class="content">
            <p>A sample page designed with Flexbox and CSS Grid.</p>
        </section>

        <footer>
            <p>© 2025 RUGUT</p>
        </footer>
    </div>

</body>
</html>
